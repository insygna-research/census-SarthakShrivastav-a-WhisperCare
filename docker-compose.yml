services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - livekit

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whispercare
      POSTGRES_PASSWORD: whispercare
      POSTGRES_DB: whispercare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50060:50000-50060/udp"

volumes:
  postgres_data:

