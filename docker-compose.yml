services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WHISPERCARE_IMAGE:-whispercare:local}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://whispercare:whispercare@postgres:5432/whispercare}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

  voice-worker:
    image: ${WHISPERCARE_IMAGE:-whispercare:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://whispercare:whispercare@postgres:5432/whispercare}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      WHISPERCARE_API_BASE_URL: ${WHISPERCARE_API_BASE_URL:-http://api:8000/api}
      WHISPERCARE_WORKER_MODE: ${WHISPERCARE_WORKER_MODE:-stub}
    command: ["python", "-m", "app.livekit.healthcare_voice_agent"]
    depends_on:
      api:
        condition: service_started
      livekit:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whispercare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whispercare}
      POSTGRES_DB: ${POSTGRES_DB:-whispercare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:${LIVEKIT_IMAGE_TAG:-latest}
    command: ["--config", "/etc/livekit/livekit.yaml"]
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_RANGE:-50000-50060}:50000-50060/udp"
    volumes:
      - ./config/livekit.dev.yaml:/etc/livekit/livekit.yaml:ro
    restart: unless-stopped

volumes:
  postgres_data:

