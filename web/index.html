<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhisperCare Demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 760px; }
      label { display: block; margin-top: 1rem; }
      input, textarea, button { width: 100%; padding: .75rem; margin-top: .35rem; }
      pre { background: #f4f4f4; padding: 1rem; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>WhisperCare Intake Demo</h1>
    <label>API Base URL <input id="api" value="http://localhost:8000/api" /></label>
    <button id="start">Start Intake</button>
    <label>Answer <textarea id="answer"></textarea></label>
    <button id="send">Send Turn</button>
    <pre id="output"></pre>
    <script>
      let sessionId = null;
      const output = document.getElementById("output");
      document.getElementById("start").onclick = async () => {
        const base = document.getElementById("api").value;
        const res = await fetch(`${base}/intake/sessions`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({intake_type: "combined"})
        });
        const json = await res.json();
        sessionId = json.session_id;
        output.textContent = JSON.stringify(json, null, 2);
      };
      document.getElementById("send").onclick = async () => {
        const base = document.getElementById("api").value;
        const text = document.getElementById("answer").value;
        const res = await fetch(`${base}/intake/sessions/${sessionId}`, {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({input_text: text, source: "ui"})
        });
        output.textContent = JSON.stringify(await res.json(), null, 2);
      };
    </script>
  </body>
</html>
