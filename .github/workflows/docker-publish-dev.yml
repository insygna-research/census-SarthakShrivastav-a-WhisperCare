name: Publish Docker Image

on:
  pull_request:
    types: [closed]
    branches: [dev, main]

jobs:
  publish-image:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4

      - name: Install workflow dependencies
        run: python -m pip install --upgrade PyYAML

      - name: Resolve Docker image repository
        id: image
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("config/app.yaml").read_text())
          repository = config["docker"]["image_repository"]
          print(f"repository={repository}")
          PY

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          base_ref="${{ github.event.pull_request.base.ref }}"
          if [ "$base_ref" = "main" ]; then
            echo "tags=${{ steps.image.outputs.repository }}:main-${short_sha},${{ steps.image.outputs.repository }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ steps.image.outputs.repository }}:dev-${short_sha},${{ steps.image.outputs.repository }}:dev-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
