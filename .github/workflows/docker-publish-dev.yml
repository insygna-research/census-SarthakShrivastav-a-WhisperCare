name: Publish Dev Docker Image

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  publish-dev-image:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4

      - name: Resolve Docker image repository
        id: image
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("config/app.yaml").read_text())
          repository = config["docker"]["image_repository"]
          print(f"repository={repository}")
          PY

      - name: Resolve short SHA
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:dev-${{ steps.sha.outputs.short }}
            ${{ steps.image.outputs.repository }}:dev-latest
